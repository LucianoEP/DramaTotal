<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador Drama Total</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: fan-made reality show, loud and funny but easy to read like an episode recap
   IDEA: the camp itself, a wooden sign over a forest clearing; each part of an episode is its own page, like the show's segments
   PICTURE: character portraits everywhere, a tiny totem on whoever holds an advantage
   COLOUR and TYPE: forest green field, sign yellow accent, wood brown; Luckiest Guy + Nunito
   LAYOUT: sign header + page tabs; setup as a 3-step wizard; game pages: episode, cast, alliances, relationships, votes */
:root{color-scheme:light dark;
--bg:light-dark(#eef3ea,#0e1a12);--card:light-dark(#ffffff,#16261b);--ink:light-dark(#18231b,#e8efe6);--mute:light-dark(#5b6b5f,#9fb2a3);
--line:light-dark(#d5e0d2,#2a3d2f);--forest:#21482f;--forest2:#2c5e3d;--sign:#f6c026;--wood:#7a4b22;--danger:light-dark(#b83232,#ff7b7b);--you:light-dark(#fff6d6,#3a3210);--head:light-dark(#2c5e3d,#f6c026);--woodt:light-dark(#7a4b22,#d9a46b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Luckiest Guy",Impact,sans-serif;font-weight:400;letter-spacing:.5px;line-height:1.05;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
.top{background:var(--forest);color:#fff;padding:16px max(4vw,14px) 0;border-bottom:6px solid var(--wood)}
.topin{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.sign{background:linear-gradient(#8f5a2a,#6b3f1b);border:3px solid #4a2a10;border-radius:10px;padding:8px 16px 6px;box-shadow:0 6px 0 #3a210c, inset 0 2px 0 #b07a44;transform:rotate(-1.5deg);display:flex;gap:12px;align-items:center}
.sign img{width:46px;height:46px;border-radius:50%;border:2px solid #3a210c}
.sign h1{color:var(--sign);font-size:clamp(24px,4vw,40px);text-shadow:2px 2px 0 #3a210c}
.sign small{display:block;color:#f5e2c4;font-size:13px;margin-top:2px}
.topbtns{display:flex;gap:8px;flex-wrap:wrap}
.tabs{max-width:1240px;margin:14px auto 0;display:flex;gap:4px;overflow-x:auto}
.tab{flex:none;min-height:44px;padding:8px 16px;border:0;border-radius:10px 10px 0 0;background:#ffffff1a;color:#fff;font-weight:800}
.tab[aria-current=true]{background:var(--bg);color:var(--ink)}
.tab:disabled{opacity:.45;cursor:default}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:800}
.btn.go{background:var(--sign);border-color:#c99a0c;color:#2a1d00;box-shadow:0 4px 0 #b3870a}
.btn.go:active{transform:translateY(2px);box-shadow:0 2px 0 #b3870a}
.btn.ghost{background:transparent;color:#fff;border-color:#ffffff66}
.wrap{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,32px) max(4vw,14px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card h2,.ph2{font-size:26px;color:var(--head);margin-bottom:10px}
.lbl{display:block;font-weight:800;font-size:14px;margin-bottom:4px}
.hint{font-size:13px;color:var(--mute)}
.field{margin-bottom:16px}
select,input[type=number],input[type=text]{width:100%;min-height:44px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
input[type=range]{width:100%;accent-color:var(--forest2);min-height:32px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 140px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:44px;border:0;background:transparent;font-weight:800;font-size:14px;padding:6px 10px}
.seg button[aria-pressed=true]{background:var(--forest2);color:#fff}
.bigopt{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px}
.bigopt button{text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);min-height:80px}
.bigopt button[aria-pressed=true]{border-color:var(--forest2);background:light-dark(#dcebd9,#20402a);box-shadow:inset 0 0 0 1px var(--forest2)}
.bigopt b{display:block;font-size:17px}
.bigopt small{color:var(--mute);font-size:13px}
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.step{flex:1 1 150px;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:800;text-align:left;padding:6px 12px;display:flex;gap:8px;align-items:center}
.step i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--line);flex:none}
.step[aria-current=true]{border-color:var(--forest2)}
.step[aria-current=true] i{background:var(--forest2);color:#fff}
.teamnames{display:grid;gap:6px;max-height:280px;overflow:auto}
.teamnames div{display:flex;gap:6px;align-items:center}
.sw{width:18px;height:18px;border-radius:5px;flex:none}
.group{margin-bottom:14px}
.group h3{font-size:18px;color:var(--woodt);margin-bottom:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.group h3 button{font-family:Nunito;font-size:12px;border:1px solid var(--line);background:transparent;border-radius:6px;padding:2px 8px;min-height:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 4px;border-radius:99px;border:2px solid var(--line);background:var(--bg);font-weight:700;font-size:14px}
.chip[aria-pressed=true]{border-color:var(--forest2);background:light-dark(#dcebd9,#20402a)}
.chip[aria-pressed=false] .av{filter:grayscale(1);opacity:.45}
.av{--t:#888;position:relative;width:34px;height:34px;border-radius:50%;background:var(--t);color:#fff;display:inline-grid;place-items:center;font:800 12px Nunito,sans-serif;flex:none;box-shadow:0 0 0 2px var(--t)}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av.lg{width:64px;height:64px;font-size:20px;box-shadow:0 0 0 3px var(--t)}
.av.xl{width:96px;height:96px;font-size:26px;box-shadow:0 0 0 4px var(--t)}
.av.out img,.av.out{filter:grayscale(1)}
.av .tot{position:absolute;right:-7px;bottom:-5px;width:13px;height:21px;filter:drop-shadow(0 0 1px #000) drop-shadow(0 1px 0 #0008)}
.av.lg .tot,.av.xl .tot{width:20px;height:32px;right:-8px;bottom:-4px}
.count{color:var(--forest2)}
.navbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
.navbar .sp{flex:1}
.err{color:var(--danger);font-weight:800}
.custom{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr)) auto;gap:6px;align-items:end}
.custom label{font-size:12px;font-weight:800}
/* episode */
.pills{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px;margin-bottom:10px}
.tbuild{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.trow{display:flex;gap:8px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.trow span{flex:1;font-weight:700;font-size:14px}.trow select{flex:0 1 150px;min-height:38px;font-size:14px;padding:4px 6px;background:var(--card)}
.relrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;margin-bottom:6px}
.relrow.two{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto}
.banner{background:var(--you);border:2px solid var(--sign);border-radius:12px;padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 260px}
.seqcta{background:var(--card);border:3px solid var(--sign);border-radius:14px;padding:16px;margin:14px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seqcta p{margin:0;flex:1 1 260px}
@media(max-width:600px){.relrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.pill{flex:none;min-height:40px;padding:6px 14px;border-radius:99px;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:14px}
.pill[aria-current=true]{background:var(--forest2);color:#fff;border-color:var(--forest2)}
.secs{display:flex;gap:4px;overflow-x:auto;margin:10px 0 12px}
.sec{flex:none;min-height:36px;padding:4px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;font-size:13px;font-weight:700;color:var(--mute)}
.sec[aria-current=true]{background:var(--wood);color:#fff;border-color:var(--wood)}
.ephead{display:flex;justify-content:space-between;align-items:baseline;gap:6px 10px;flex-wrap:wrap}
.ephead h2{font-size:clamp(26px,4vw,40px);color:var(--head);text-wrap:balance}
.blk>h3{font-size:22px;background:var(--forest);color:var(--sign);padding:10px 16px;border-radius:12px 12px 0 0}
.blk.conf>h3{background:var(--wood);color:#fff}
.blk.spec>h3{background:#8a2c2c;color:#fff}
.blk ul{list-style:none;margin:0;padding:6px 16px 10px;background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;min-height:120px}
.blk li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.blk li:last-child{border-bottom:0}
.blk li .avs{display:flex;flex:none;padding-right:4px}
.blk li .avs .av+.av{margin-left:-6px}
.blk li.big{font-size:18px;font-weight:800}
.blk li.bad{color:var(--danger)}
.blk li.you{background:var(--you);margin:0 -16px;padding:9px 16px}
.blk li.host{font-style:italic}
.blk li.phase{padding-top:16px;font-family:"Luckiest Guy",Impact,sans-serif;font-size:18px;color:var(--woodt);letter-spacing:.4px}
.nm{font-weight:800}
.nm.me{text-decoration:underline wavy var(--sign) 2px;text-underline-offset:3px}
.alname{font-weight:800;color:var(--woodt)}
.votes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px 14px;width:100%;font-size:14px}
.votes span{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.votes s{opacity:.6}
.badge{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;background:var(--sign);color:#2a1d00;white-space:nowrap}
.badge.x{background:var(--line);color:var(--ink)}
.mm{width:16px;height:12px;border-radius:6px;background:#fff;border:2px solid #d8c9b5;display:inline-block;flex:none;vertical-align:-1px}
.bar{height:8px;border-radius:4px;background:var(--line);flex:1;min-width:60px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--t,#2c5e3d)}
.ask{border:3px solid var(--sign);background:light-dark(#fffaf0,#2a2510);border-radius:14px;padding:16px;margin-top:14px;scroll-margin-top:20px}
.ask h3{font-size:22px;margin-bottom:10px;line-height:1.2}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.opt{text-align:left;min-height:52px;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);display:flex;gap:10px;align-items:center}
.opt:hover{border-color:var(--forest2)}
.opt b{display:block}
.opt small{display:block;color:var(--mute);font-size:13px}
.win{background:var(--sign);color:#2a1d00;border-radius:14px;padding:18px;text-align:center;margin:12px 0;display:grid;justify-items:center;gap:8px}
.win h2{font-size:clamp(28px,5vw,46px)}
/* cast page */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;justify-items:center;text-align:center;border-top:6px solid var(--t)}
.ccard.out{opacity:.8}
.ccard h3{font-size:20px}
.stat{display:grid;grid-template-columns:5.5em 1fr 1.6em;gap:6px;align-items:center;font-size:12px;width:100%;text-align:left}
.meta{font-size:13px;color:var(--mute)}
.tagrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.tagrow:empty{display:none}
.tg{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line)}
/* alliances */
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.acard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-left:6px solid var(--t)}
.acard h3{font-size:20px;margin-bottom:8px}
.amem{display:flex;gap:6px;flex-wrap:wrap}
.amem span{display:flex;gap:6px;align-items:center;font-size:14px;font-weight:700;background:var(--bg);border-radius:99px;padding:2px 10px 2px 2px}
.alog{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.alog li{padding:4px 0;border-top:1px dashed var(--line);display:flex;gap:8px}
.alog b{flex:none;width:3.6em;color:var(--mute)}
.track{overflow-x:auto}
.track table{border-collapse:collapse;font-size:13px}
.track th,.track td{padding:6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
.track th:first-child,.track td:first-child{text-align:left;position:sticky;left:0;background:var(--card)}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;background:var(--t);color:#fff;font-size:11px;line-height:22px;font-weight:800}
/* relations */
.rlist{display:grid;gap:4px}
.rrow{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(80px,2fr) 3em;gap:10px;align-items:center;font-size:14px}
.rbar{height:10px;border-radius:5px;background:var(--line);position:relative}
.rbar i{position:absolute;top:0;bottom:0;border-radius:5px}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th,table.t td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
.scroll{overflow-x:auto}
.legend{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute)}
.foot{font-size:13px;color:var(--mute);text-align:center;padding:20px}
.empty{padding:30px;text-align:center;color:var(--mute)}
@media(max-width:700px){.custom{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.custom .nmf{grid-column:1/-1}.rrow{grid-template-columns:auto minmax(0,1fr) 3em}.rrow .rbar{grid-column:1/-1;order:5}}
@media(max-width:600px){table.t{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.ask{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translateY(6px)}}}
[hidden]{display:none!important}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>

function startGame(cfg){
  const sel=[...cfg.sel].map(id=>byId[id]).filter(Boolean);
  const se=SEASONS[cfg.season];
  const T=Math.max(1,cfg.teams);
  const teams=Array.from({length:T},(_,i)=>({name:cfg.names[i]||('Equipo '+(i+1)),color:COLORS[i%COLORS.length]}));
  const cast=sel.map(c=>({...c,s:c.s.slice(),alive:true,team:-1,wins:0,va:0,adv:[],advUsed:0,eo:0,ep:null,debuff:false,lowkey:false,lastVotes:0,advGot:0,fakeGot:0,indWins:0,returned:0,teamHist:[]}));
  if(T>1){
    const tmap=cfg.teamMap||{};cast.forEach(c=>{const i=tmap[c.id];if(i!=null&&i>=0&&i<T)c.team=i});
    shuffle(cast.filter(c=>c.team<0)).forEach(c=>{const cnt=teams.map((t,i)=>cast.filter(x=>x.team===i).length);c.team=cnt.indexOf(Math.min(...cnt))});
  }
  cast.forEach(c=>{c.team0=c.team;c.teamHist=c.team>=0?[c.team]:[]});
  G={cfgRaw:cfg,lastSpecial:0,full:false,seq:null,cfg:{...cfg,adv:+cfg.adv,swaps:cfg.swaps==='1',reward:cfg.reward==='1',dbl:cfg.dbl==='1',special:cfg.special==='1',saga:cfg.saga||1},se,cast,teams,merged:T<=1,race:T>1&&cfg.preElim==='equipo',ep:0,episodes:[],rel:{},alli:[],alSeq:0,alNames:shuffle(AL_NAMES),rom:[],rivals:new Set(),bff:new Set(),used:[],eo:0,over:false,player:cfg.mode==='play'?cfg.player:null,view:{e:0,s:0},tab:'ep',pending:null,gate:null,busy:false,auto:false,lastSwap:0,lastDbl:0,lastOut:[],lastWin:null,lastLose:null,advExpired:false,notes:[],fakes:{},lastNoVote:0,retPlan:[],snap:[],votes:[],relSel:null,alEp:null};
  const has=id=>cast.find(c=>c.id===id);
  for(let i=0;i<cast.length;i++)for(let j=i+1;j<cast.length;j++){const a=cast[i],b=cast[j];
    G.rel[key(a.id,b.id)]=Math.round(L()?rnd(-8,8)+(a.o===b.o?5:0)+(a.team===b.team&&T>1?(G.race?30:5):0):rnd(-25,25)+(a.team===b.team&&G.race?20:0))}
  if(cfg.carry){const C=cfg.carry;
    for(const k in C.rel){const [a,b]=k.split('|');if(has(a)&&has(b))G.rel[k]=C.rel[k]}
    G.rom=C.rom.filter(r=>has(r.a)&&has(r.b)).map(r=>({...r}));C.rivals.forEach(k=>{const [a,b]=k.split('|');if(has(a)&&has(b))G.rivals.add(k)});C.bff.forEach(k=>{const [a,b]=k.split('|');if(has(a)&&has(b))G.bff.add(k)});
    C.al.forEach(a=>{const mem=a.mem.map(has).filter(Boolean);if(mem.length>=2&&mem.every(c=>!allyOf(c))){const al=formAl(mem,a.name);al.log[0].t='Viene de la temporada anterior: '+mem.map(c=>c.n).join(', ')+'.'}});
  }else if(L()){
    CANON_REL.forEach(([x,y,v])=>{const a=has(x),b=has(y);if(a&&b)G.rel[key(a.id,b.id)]=v+Math.round(rnd(-5,5))});
    CANON_ROM.forEach(([x,y])=>{const a=has(x),b=has(y);if(a&&b&&free(a)&&free(b)){G.rom.push({a:a.id,b:b.id,st:'crush'});G.rel[key(a.id,b.id)]=Math.max(rel(a,b),40)}});
    CANON_AL.forEach(([n,m])=>{const mem=m.map(has).filter(Boolean);if(mem.length<2)return;const tm=G.merged||G.race?mem:mem.filter(c=>c.team===mem[0].team);if(tm.length>=2&&tm.every(c=>!allyOf(c))){G.ep=0;const al=formAl(tm,n);al.log[0].t='Viene armada desde la serie: '+tm.map(c=>c.n).join(', ')+'.'}});
  }
  cast.filter(c=>c.o==='custom').forEach(c=>{(c.rels||[]).forEach(([id,t])=>{const o=has(id);if(o&&RTYPES[t])applyRelType(c,o,t)});const mem=[c,...(c.ally||[]).map(has).filter(Boolean)];if(mem.length>=2){const al=formAl(mem,c.allyName||undefined);al.log[0].t='Alianza inicial: '+mem.map(x=>x.n).join(', ')+'.'}});
  (cfg.rels||[]).forEach(([x,t,y])=>{const a=has(x),b=has(y);if(a&&b&&a!==b&&RTYPES[t])applyRelType(a,b,t)});
  (cfg.alls||[]).forEach(a=>{const mem=a.mem.map(has).filter(Boolean);if(mem.length>=2){const al=formAl(mem,a.name||undefined);al.log[0].t='Alianza inicial: '+mem.map(x=>x.n).join(', ')+'.'}});
  {const M=cfg.mergeAt>0?cfg.mergeAt:cast.length,lo=cfg.finalSize+2,x=+cfg.extraRet||0;for(let k=1;k<=x;k++){const t=Math.round(M-(M-lo)*k/(x+1));if(t>=lo&&t<M)G.retPlan.push(t)}}

async function nextEpisode(){
  if(!G||G.busy||G.over)return;G.busy=true;G.ep++;
  const E={n:G.ep,title:'Episodio '+G.ep,blocks:[],left:alive().length};G.episodes.push(E);
  if(!G.auto){G.view={e:G.episodes.length-1,s:0};G.tab='ep'}
  const myG=G;
  G.cur=(async()=>{try{await runEpisode(E)}finally{if(myG===G){G.busy=false;E.done=true;G.snap.push({ep:E.n,al:actAl().map(a=>({id:a.id,mem:a.mem.slice()}))});draw()}}})();
  return G.cur;
}
async function runEpisode(E){
  const fs=G.cfg.finalSize;
  if(units()<=fs){await finale(E);return}
  if(E.n===1)await intro(E);else await recap(E);
  if(shouldMerge()){if(G.cfg.retN>0)await returnEvent(E,G.cfg.retN,'Repechaje antes de la fusión');await doMerge(E)}
  else await extraReturn(E);
  if(!G.race&&units()===fs+1&&G.cast.some(c=>!c.alive)){await semifinal(E);return}
  await teamBalance(E);
  const post=G.merged&&units()>fs+2;
  const dbl=G.cfg.dbl&&!G.race&&units()>=fs+4&&E.n>=3&&E.n-G.lastDbl>=4&&Math.random()<.16&&(G.merged||liveTeams().every(i=>teamOf(i).length>=3));
  E.noVote=!dbl&&post&&E.n-G.lastNoVote>=3&&Math.random()<.13;
  const special=G.cfg.special&&!G.race&&!dbl&&!E.noVote&&units()>fs+2&&E.n>=2&&E.n-G.lastSpecial>=3&&Math.random()<(L()?.07:.11);
  await camp(E);
  if(G.cfg.reward&&!G.race&&E.n>1&&Math.random()<.35)await rewardChallenge(E);
  await confessional(E);
  if(dbl){G.lastDbl=E.n;const b=await sec(E,'¡Sorpresa!','spec');hline(b,`${H()}: "¿Pensaban que esta noche se iba uno solo? Error. ¡Hoy es doble eliminación! Los dos más votados se van."`);line(b,[],'Las alianzas tienen que reorganizarse a toda velocidad.','big')}
  const res=await challenge(E);
  if(res.type==='team'&&G.race)await raceElim(E,res);
  else if(E.noVote&&res.last){G.lastNoVote=E.n;await directElim(E,res.last)}
  else{let skip=false;
    if(special){G.lastSpecial=E.n;skip=await specialElim(E,res)}
    if(!skip&&!(res.type==='team'&&teamOf(res.loser).length<2))await ceremony(E,res,dbl?2:1)}
  alive().forEach(c=>{c.lowkey=false;c.debuff=false});
  if(!G.over){const u=units();
    if(u<=fs)line(await sec(E,'Próximamente'),[],`Quedan ${u} ${G.race?'equipos':'participantes'}: ¡se viene la gran final!`,'big');
    else if(!G.race&&u===fs+1)line(await sec(E,'Próximamente'),[],`Quedan ${u}: en la semifinal, el jurado de eliminados decide quién no llega a la final.`,'big')}
}
async function intro(E){

  hline(b,`${H()} recibe a ${G.cast.length} participantes en ${G.se.place}. Hay ${G.se.prize} en juego y solo ${G.race?'un equipo':'una persona'} se lo va a llevar.`);
  line(b,[HOSTS.chef],'Chef mira a los recién llegados desde la cocina y afila un cuchillo. Mal presagio.');
  if(G.teams.length>1)G.teams.forEach((t,i)=>{const m=G.cast.filter(c=>c.team===i);line(b,m.length<=6?m:[],`<span>${teamName(i)}: ${m.map(nm).join(', ')}</span>`)});

async function returnEvent(E,n,title){
  const pool=G.cast.filter(c=>!c.alive);if(!pool.length||G.race)return;
  const b=await sec(E,title,'spec');
  n=Math.min(n,pool.length);
  hline(b,`${H()} reúne a los ${pool.length} eliminados: ${n===1?'uno vuelve':n+' vuelven'} a competir. Para ganarse el lugar tienen que cruzar la pista de obstáculos de Chef.`);
  const ranked=pool.map(c=>({c,v:c.s[0]*1.4+c.s[1]+c.s[2]*.6+rnd(0,noise(18))})).sort((a,b)=>b.v-a.v);
  if(ranked.length>n)line(b,[ranked[ranked.length-1].c],fmt('{A} se queda trabado en el primer obstáculo.',ranked[ranked.length-1].c),'bad');
  if(ranked.length>n+1)line(b,[ranked[n].c],fmt('{A} queda a centímetros de volver. Tan cerca…',ranked[n].c),'bad');
  ranked.slice(0,n).forEach(({c})=>{c.alive=true;c.returned++;c.eo=0;c.ep=null;c.adv=[];
    if(!G.merged){const lt=liveTeams().length?liveTeams():G.teams.map((t,i)=>i);const cnt=lt.map(i=>teamOf(i).length);setTeam(c,lt[cnt.indexOf(Math.min(...cnt))])}
    line(b,[c],`${nm(c)} gana su lugar y vuelve al juego${G.merged||shouldMerge()?'':' con '+teamName(c.team)}.`,'big');
    alive().forEach(o=>{if(o!==c&&rel(o,c)<0)addRel(o,c,-5)});note([c],`${nm(c)} volvió al juego en el repechaje.`)});
  const back=ranked.slice(0,n).map(x=>x.c);if(back.length>=2&&L()&&rel(back[0],back[1])>0){const al=allianceDeal(back[0],back[1]);line(b,back.slice(0,2),`Los que volvieron se juntan enseguida: ${alH(al)}.`)}
}
async function extraReturn(E){

function shouldMerge(){if(G.merged)return false;return (G.cfg.mergeAt>0&&alive().length<=G.cfg.mergeAt)||(liveTeams().length<=1&&!G.race)}

async function teamBalance(E){
  if(G.merged||G.race)return;
  const lt=liveTeams();if(lt.length<2)return;
  const sz=i=>teamOf(i).length;
  const sorted=[...lt].sort((a,b)=>sz(a)-sz(b));
  const small=sorted[0],big=sorted[sorted.length-1];
  const restAvg=sorted.slice(1).reduce((t,i)=>t+sz(i),0)/(sorted.length-1);
  if(lt.length>2&&(sz(small)<=2||sz(small)<=restAvg*.45)){
    const b=await sec(E,'¡Equipo disuelto!','spec');
    const mem=shuffle(teamOf(small));const others=sorted.slice(1);const nmT=teamName(small);
    hline(b,`A ${nmT} le quedan muy pocos integrantes, así que ${H()} disuelve el equipo y reparte a sus miembros entre los demás.`);
    mem.forEach(c=>{const dest=[...others].sort((a,b)=>sz(a)-sz(b))[0];setTeam(c,dest);line(b,[c],`${nm(c)} pasa a ${teamName(dest)}.`)});
    note([],`${nmT} se disolvió y sus integrantes se repartieron.`);return;
  }
  if(!G.cfg.swaps)return;
  const diff=sz(big)-sz(small);
  if(diff>=3||(diff===2&&Math.random()<.5)){
    const n=Math.floor(diff/2);
    const b=await sec(E,'¡Cambio de equipos!','spec');
    hline(b,`${teamName(big)} tiene ${sz(big)} integrantes y ${teamName(small)} apenas ${sz(small)}. Para equilibrar, ${H()} manda ${n===1?'a uno':'a '+n} de un equipo al otro.`);
    for(let k=0;k<n;k++){const m=teamOf(big);const mv=L()?m.reduce((p,c)=>{const s=m.reduce((t,o)=>t+(o!==c?rel(c,o):0),0);return !p||s<p.s?{c,s}:p},null).c:pick(m);setTeam(mv,small);
      line(b,[mv],L()?`${nm(mv)}, quien peor se llevaba con su equipo, pasa a ${teamName(small)}.`:`${nm(mv)} pasa a ${teamName(small)}.`,'big');note([mv],`${nm(mv)} cambió de equipo.`)}
    G.lastSwap=E.n;return;
  }
  if(E.n>=3&&E.n-G.lastSwap>=3&&Math.random()<.15){
    const [a,c]=shuffle(lt);const A=teamOf(a),C=teamOf(c);if(A.length<2||C.length<2)return;
    const x=pick(A),y=pick(C);setTeam(x,c);setTeam(y,a);G.lastSwap=E.n;
    const b=await sec(E,'¡Intercambio!','spec');
    hline(b,`${H()} anuncia un intercambio: un integrante de ${teamName(a)} pasa a ${teamName(c)} y viceversa.`);
    line(b,[x,y],fmt('{A} y {B} cambian de equipo. Las caras de sus viejos compañeros lo dicen todo.',x,y),'big');note([x,y],fmt('{A} y {B} intercambiaron equipos.',x,y));
  }
}

async function npcEvent(b,P){
  const pool=alive();const a=pick(pool.filter(c=>c!==P).length?pool.filter(c=>c!==P):pool);
  let cand=pool.filter(c=>c!==a);
  if(!cand.length)return EV.solo(b,a);
  if(!G.merged&&Math.random()<.7){const s=cand.filter(c=>c.team===a.team);if(s.length)cand=s}
  let x;
  if(L()){x=wpick(cand.map(c=>[c,8+Math.abs(rel(a,c))+(allied(a,c)?15:0)+(isCouple(a,c)?25:0)]))}else x=pick(cand);

  else type=wpick([['solo',1],['pos',1.5],['neg',1.5],['trio',1],['romance',1],['rival',.7],['alliance',1.5],['adv',canGiveAdv()?.5*G.cfg.adv:0],['advtrade',a.adv.length?1.2:0],['fake',G.cfg.adv>0?.3:0],['injury',.3],['chef',.4],['host',.3]]);
  if(!EV[type](b,a,x))EV[r>=0?'pos':'neg'](b,a,x);
}
function allianceUpkeep(b){
  for(const c of alive()){if(c===me()||!c.adv.includes('falsa'))continue;if(c.s[1]>=7&&Math.random()<(L()?.3:.15)){c.adv.splice(c.adv.indexOf('falsa'),1);const pl=byIdG(G.fakes[c.id]);if(pl&&Math.random()<.5){addRel(c,pl,-30);line(b,[c,pl],fmt('{A} examina su estatuilla y descubre que es falsa. Y sabe muy bien quién se la plantó: {B}.',c,pl),'bad');checkRival(b,c,pl)}else line(b,[c],fmt('{A} examina su estatuilla con lupa y descubre que es falsa. La tira al lago.',c),'bad')}}
  for(const al of actAl()){
    const mem=al.mem.map(byIdG).filter(c=>c&&c.alive);
    if(L()){for(const c of mem){if(c===me())continue;const avg=mem.reduce((t,o)=>t+(o!==c?rel(c,o):0),0)/Math.max(1,mem.length-1);if(avg<-15){leaveAl(al,c,'rompe con la alianza');line(b,[c],`${nm(c)} rompe con ${alH(al)}: la convivencia se volvió insoportable.`,'bad');note([c],`${nm(c)} rompió con ${alH(al)}.`);break}}}
    else if(Math.random()<.12&&mem.length){const c=pick(mem);if(c!==me()){leaveAl(al,c,'se va sin dar explicaciones');line(b,[c],`${nm(c)} abandona ${alH(al)} de un día para el otro.`,'bad')}}
  }
}

    if(a==='sabotaje'){const t=await chooseTarget('¿A quién saboteás?',os,relHint);t.debuff=true;
      if(Math.random()<0.25+t.s[1]/40){addRel(P,t,-35);alive().forEach(o=>{if(o!==t&&o!==P&&rel(o,t)>20)addRel(o,P,-10)});line(b,[P,t],fmt('{A} le esconde las zapatillas a {B}… y {B} lo descubre. Se arma un escándalo.',P,t),'bad');checkRival(b,P,t)}
      else line(b,[P,t],fmt('{A} le esconde las zapatillas a {B}. Nadie se entera.',P,t))}
    if(a==='perfil'){P.lowkey=true;line(b,[P],fmt('{A} se queda en la cabaña y evita los problemas.',P))}
    if(a==='buscar'){if(advActive()<Math.max(1,Math.floor(alive().length/5))+1&&Math.random()<(0.2+P.s[1]/40)*Math.min(1.3,G.cfg.adv)){const t=giveAdv(P);line(b,[P],fmt(`¡{A} encuentra un tótem escondido en un tronco hueco! Adentro hay esto: ${ADV[t]}.`,P),'big')}else line(b,[P],fmt('{A} revuelve media isla, pero no encuentra nada. Alguien lo vio buscar…',P));if(Math.random()<.3)others(P).slice(0,3).forEach(o=>addRel(o,P,-3))}
  }

  if(playing()){const b2=await sec(E,'Un momento para decidir');for(const d of shuffle(DILEMMAS)){if(await d(P,b2))break}}

const perfBase=(c,w)=>{const ws=w[0]+w[1]+w[2]||1;return (c.s[0]*w[0]+c.s[1]*w[1]+c.s[2]*w[2])/ws*10+rnd(0,noise(45))-(c.debuff?15:0)};
async function rewardChallenge(E){

async function challenge(E,label){
  const pool=challengePool().filter(c=>!G.used.slice(-10).includes(c.n));const C=pick(pool.length?pool:challengePool());G.used.push(C.n);

  if(E.noVote)hline(b,'¡Atención! Hoy no hay ceremonia: quien termine último queda eliminado en el acto.');
  const P=me();let mode='seguro';const boosted=new Set();
  for(const c of alive()){if(!hasAdv(c,'desafio'))continue;const u=(c===P&&playing())?await yesNo('¿Usás tu Ventaja para el desafío ahora?','Sí, usarla','No, guardarla',ADV_DESC.desafio):true;if(u){useAdv(c,'desafio');boosted.add(c);line(b,[c],fmt('{A} usa su Ventaja para el desafío y arranca varios pasos adelante.',c),'big')}}

    if(mode==='todo'&&Math.random()<.15){P.hurt=true;line(b,[P],fmt('{A} arranca con todo… y se tuerce el tobillo en el calentamiento.',P),'bad')}

  }
  const mod=c=>(boosted.has(c)?18:0)+(c===P&&playing()?(mode==='todo'?(P.hurt?-20:14):mode==='tirar'?-28:0):0);
  const perf=(c,ph)=>perfBase(c,ph.w)+mod(c);
  const narr=(group,sc,ph,solo)=>{
    const s=[...group].sort((x,y)=>sc.get(y)-sc.get(x));const said=new Set();

  };

    const scored=C.ph.filter(p=>p.m!=='aud').length;
    for(const ph of C.ph){
      if(C.ph.length>1)line(b,[],esc(ph.n),'phase');
      const parts=new Map();const sc=new Map();
      for(const i of lt){let m=teamOf(i);if(ph.m==='reps'){const k=Math.min(ph.k,m.length);if(k<m.length)m=await pickReps(b,i,m,k,ph,aud)}
        parts.set(i,m);m.forEach(c=>{const v=perf(c,ph);sc.set(c,v);allSc.set(c,(allSc.get(c)||0)+v)})}
      if(lt.length>4)narr([...parts.values()].flat(),sc,ph,false);else for(const i of lt)narr(parts.get(i),sc,ph,parts.get(i).length<2);
      if(ph.m==='aud'){aud=sc;line(b,[],'Las audiciones terminan: cada equipo ya sabe quiénes son sus mejores cartas.');continue}
      const rk=lt.map(i=>{const m=parts.get(i);return{i,v:m.reduce((s,c)=>s+sc.get(c),0)/m.length}}).sort((x,y)=>y.v-x.v);

    const W=fin[0].i,Lo=fin[fin.length-1].i;

      if(C.ph.length>1)line(b,[],esc(ph.n),'phase');
      const sc=new Map();rem.forEach(c=>sc.set(c,perf(c,ph)));if(!firstSc)firstSc=new Map(sc);

    const w=rem[0];w.wins++;w.indWins++;

    out={type:'ind',immune:[w]};
    if(E.noVote)out.last=alive().filter(c=>c!==w).sort((x,y)=>firstSc.get(x)-firstSc.get(y))[0];
  }
  if(P)P.hurt=false;
  return out;
}
async function pickReps(b,i,m,k,ph,aud){

function juryList(){const j=G.cast.filter(c=>!c.alive&&c.madeMerge).sort((a,b)=>b.eo-a.eo);return j.length?j:G.cast.filter(c=>!c.alive).sort((a,b)=>b.eo-a.eo).slice(0,9)}
async function semifinal(E){

async function finale(E){

  const b=await sec(E,'La gran final','spec');
  const P=me();

  else fins=alive().map(c=>({name:c.n,m:[c]}));
  const fname=f=>f.m.length>1?teamName(f.i):nm(f.m[0]);
  hline(b,`Llegan a la final: ${fins.map(fname).join(', ')}. Hay ${G.se.prize} en juego.`);
  fins.forEach(f=>f.m.forEach(c=>line(b,[c],`${nm(c)}: <q>${esc(pick(['Llegué hasta acá y no pienso perder.','Pensar que el primer día no sabía ni dónde estaba el baño.','Esto es por todos los que me subestimaron.','Gane o pierda, fue la mejor experiencia de mi vida.']))}</q>`)));
  const fb=await sec(E,'El momento de la verdad');
  let winner;
  if(G.cfg.finalMode==='jurado'&&!G.race){
    const jury=juryList();
    if(jury.length){
      line(fb,[],'El jurado de eliminados vota quién se lleva el premio.','phase');
      const jv=[];
      for(const j of jury){let t;
        if(j===P)t=await chooseTarget('Sos parte del jurado. ¿Quién merece ganar?',fins.map(f=>f.m[0]),c=>`Relación: ${Math.round(rel(P,c))}`);
        else t=L()?fins.map(f=>f.m[0]).reduce((a,c)=>(rel(j,c)+c.wins*3+rnd(0,20))>(rel(j,a)+a.wins*3+rnd(0,20))?c:a):pick(fins).m[0];
        jv.push([j,t])}
      line(fb,[],`<div class="votes">${jv.map(([v,t])=>`<span>${av(v)}${nm(v)} → ${nm(t)}</span>`).join('')}</div>`);
      const tl=new Map();jv.forEach(([v,t])=>tl.set(t,(tl.get(t)||0)+1));
      const mx=Math.max(...tl.values());const top=[...tl].filter(x=>x[1]===mx).map(x=>x[0]);
      G.votes.push({ep:E.n,label:'Final (jurado)',out:[],rows:fins.map(f=>[f.m[0],tl.get(f.m[0])||0,false]).sort((x,y)=>y[1]-x[1]),type:'final'});
      if(top.length===1)winner=fins.find(f=>f.m[0]===top[0]);
      else line(fb,top,'¡Empate en el jurado! Se define con un último desafío.');
    }
  }
  if(!winner){
    line(fb,[],'Desafío final: la carrera de obstáculos más larga de la historia del programa','phase');
    let boost=0;
    if(playing()&&fins.some(f=>f.m.includes(P))){const m=await ask('Último desafío: ¿cómo lo encarás?',[{v:'todo',label:'A todo o nada',hint:'Gran recompensa, gran riesgo'},{v:'seguro',label:'Con la cabeza fría',hint:'Constante'}]);boost=m==='todo'?rnd(-20,30):rnd(0,10)}
    const r=fins.map(f=>({f,v:f.m.reduce((s,c)=>s+c.s[0]+c.s[1]+c.s[2]+rnd(0,noise(25))+(c===P?boost:0),0)/f.m.length})).sort((x,y)=>y.v-x.v);
    const lastF=r[r.length-1].f;
    line(fb,lastF.m,`${fname(lastF)} ${lastF.m.length>1?'tropiezan':'tropieza'} en el último tramo.`,'bad');
    r.forEach((x,k)=>line(fb,x.f.m,`${k+1}º ${fname(x.f)}`));
    winner=r[0].f;
  }
  G.winner=winner.m;
  line(fb,winner.m,`¡${winner.m.map(nm).join(' y ')} ${winner.m.length>1?'ganan':'gana'} la temporada y se ${winner.m.length>1?'llevan':'lleva'} ${G.se.prize}!`,'big');
  G.over=true;
}
function finalRanking(){
  const w=G.winner||[];const fin=G.cast.filter(c=>c.alive&&!w.includes(c));
  const elim=G.cast.filter(c=>!c.alive).sort((a,b)=>b.eo-a.eo);

    else if(t.id==='randNames'){readStep2();S.names=shuffle(TEAM_NAMES).slice(0,S.teams);fillNames();drawSetup()}
    else if(t.id==='selNone'){S.sel.clear();drawSetup()}
    else if(t.id==='selSeason'){const k=S.season;S.sel=new Set(k==='libre'?shuffle(ROSTER.filter(c=>c.o!=='custom')).slice(0,18).map(c=>c.id):SEASONS[k].cast);drawSetup()}
    else if(t.id==='selRand'){const n=clamp(num($('#randN').value,16),4,ROSTER.length);S.sel=new Set(shuffle(ROSTER).slice(0,n).map(c=>c.id));S.mergeAt=S.preElim==='equipo'?0:Math.max(4,Math.round(n*.55));drawSetup()}
    else if(t.dataset.cfally){const a=S.cform.ally,i=a.indexOf(t.dataset.cfally);i<0?a.push(t.dataset.cfally):a.splice(i,1);S.cform.open=true;drawSetup()}
    else if(t.id==='cfRelAdd'){const o=ROSTER.find(c=>c.id!==S.cform.id);S.cform.rels.push([[...S.sel].find(id=>id!==S.cform.id)||o.id,'amigos']);S.cform.open=true;drawSetup()}
    else if(t.dataset.cfreldel!==undefined){S.cform.rels.splice(+t.dataset.cfreldel,1);S.cform.open=true;drawSetup()}
    else if(t.id==='cSave'){const cf=S.cform;const n=cf.n.trim();if(!n){$('#cErr').textContent='Ponele un nombre.';return}
      const id=cf.id||'custom'+Date.now();const c={id,n,s:cf.s.slice(),o:'custom',rels:cf.rels.filter(r=>r[0]&&r[0]!==id),ally:cf.ally.filter(x=>x!==id),allyName:cf.allyName.trim()};
      const i=CUSTOM.findIndex(x=>x.id===id);if(i>=0)CUSTOM[i]=c;else CUSTOM.push(c);const j=ROSTER.findIndex(x=>x.id===id);if(j>=0)ROSTER[j]=c;else ROSTER.push(c);byId[id]=c;store.set('dt_custom',CUSTOM);S.sel.add(id);
      S.cform={id:null,n:'',s:[5,5,5,5],rels:[],ally:[],allyName:'',open:true};drawSetup()}
    else if(t.id==='cCancel'){S.cform={id:null,n:'',s:[5,5,5,5],rels:[],ally:[],allyName:'',open:true};drawSetup()}
    else if(t.dataset.cedit){const c=byId[t.dataset.cedit];S.cform={id:c.id,n:c.n,s:c.s.slice(),rels:(c.rels||[]).map(r=>r.slice()),ally:(c.ally||[]).slice(),allyName:c.allyName||'',open:true};drawSetup()}
    else if(t.dataset.cdel){const id=t.dataset.cdel;CUSTOM=CUSTOM.filter(c=>c.id!==id);const j=ROSTER.findIndex(c=>c.id===id);if(j>=0)ROSTER.splice(j,1);delete byId[id];S.sel.delete(id);store.set('dt_custom',CUSTOM);if(S.cform.id===id)S.cform={id:null,n:'',s:[5,5,5,5],rels:[],ally:[],allyName:'',open:true};S.cform.open=true;drawSetup()}
    else if(t.id==='tmSeason'){S.teamMap=seasonMap(S.season);drawSetup()}
    else if(t.id==='tmClear'){S.teamMap={};drawSetup()}
    else if(t.id==='tmRand'){S.teamMap={};shuffle([...S.sel]).forEach((id,k)=>S.teamMap[id]=k%S.teams);drawSetup()}
    else if(t.id==='relAdd'){const ids=[...S.sel];S.rels.push([ids[0],'amigos',ids[1]]);drawSetup()}
    else if(t.dataset.reldel!==undefined){S.rels.splice(+t.dataset.reldel,1);drawSetup()}
    else if(t.id==='alAdd'){S.alls.push({name:pick(AL_NAMES),mem:[]});drawSetup()}
    else if(t.dataset.aldel!==undefined){S.alls.splice(+t.dataset.aldel,1);drawSetup()}
    else if(t.dataset.almem!==undefined){const a=S.alls[+t.dataset.almem].mem,i=a.indexOf(t.dataset.c);i<0?a.push(t.dataset.c):a.splice(i,1);drawSetup()}
    else if(t.id==='dropCarry'){S.carry=null;S.saga=1;applySeason(S.season);S.step=1;drawSetup()}
    else if(t.id==='start'){
      if($('#player'))S.player=$('#player').value;
      const n=S.sel.size;let err='';
      if(n<4)err='Elegí al menos 4 personajes.';
      else if(S.teams>1&&S.teams*2>n)err=`Con ${S.teams} equipos necesitás al menos ${S.teams*2} personajes (o cambiá la cantidad de equipos en Reglas).`;
      else if(S.finalSize+1>=n)err='Hay que tener al menos dos personajes más que finalistas.';
      else if(S.preElim==='equipo'&&S.teams>1&&S.mergeAt===0&&S.teams<=S.finalSize)err='En formato carrera necesitás más equipos que finalistas.';
      else if(S.mode==='play'&&!S.sel.has(S.player))err='Elegí tu personaje.';
      if(!err&&S.teams>1){const cnt=Array(S.teams).fill(0);let un=0;[...S.sel].forEach(id=>{const i=S.teamMap[id];if(i!=null&&i>=0&&i<S.teams)cnt[i]++;else un++});
        const need=cnt.reduce((t,c)=>t+Math.max(0,2-c),0);if(need>un)err='Cada equipo necesita al menos 2 integrantes: revisá el armado de equipos.'}
      $('#err').textContent=err;if(err)return;
      startGame({...S,sel:new Set(S.sel),names:S.names.slice(),teamMap:{...S.teamMap},rels:S.rels.map(r=>r.slice()),alls:S.alls.map(a=>({name:a.name,mem:a.mem.slice()}))});
    }
    return;
  }
  if(t.dataset.tab){if(t.dataset.tab==='sum'&&!G.over)return;G.tab=t.dataset.tab;draw();window.scrollTo({top:0});return}
  if(t.dataset.opt!==undefined&&G.pending){const p=G.pending;G.pending=null;p.res(p.opts[+t.dataset.opt].v);draw();return}
  if(t.id==='bCont'&&G.gate){const g=G.gate;G.gate=null;g();return}
  if(t.id==='bNext'){nextEpisode();return}
  if(t.id==='bAll'){simAll();return}
  if(t.dataset.ep!==undefined){G.view={e:+t.dataset.ep,s:0};G.tab='ep';draw();window.scrollTo({top:0});return}
  if(t.dataset.epend!==undefined){const i=+t.dataset.epend;G.view={e:i,s:G.episodes[i].blocks.length-1};draw();window.scrollTo({top:0});return}
  if(t.dataset.sec!==undefined){G.view={e:G.view.e,s:+t.dataset.sec};draw();window.scrollTo({top:0});return}
  if(t.dataset.relsel){G.relSel=t.dataset.relsel;G.tab='rel';draw();window.scrollTo({top:0});return}
  if(t.id==='bNew'||t.id==='bNew2'){resetToSetup();return}
  if(t.id==='bAgain'||t.id==='bAgain2'){const cfg=G.cfgRaw;G=null;startGame(cfg);return}
  if(t.id==='bFull'){G.full=!G.full;draw();return}
  if(t.id==='bSeq'){G.seq=G.seq||{n:Math.max(4,Math.round(G.cast.length*.65)),q:new Set(),lines:[],done:false};G.tab='seq';draw();window.scrollTo({top:0});return}
  if(t.id==='seqSim'){G.seq.n=num($('#seqN').value,G.seq.n);seqSimulate();draw();return}
  if(t.id==='seqHand'){G.seq.q=new Set(finalRanking().slice(0,clamp(num($('#seqN').value,G.seq.n),4,G.cast.length)).map(x=>x[0].id));G.seq.lines=[];G.seq.done=true;draw();return}
  if(t.dataset.seqc){const q=G.seq.q;q.has(t.dataset.seqc)?q.delete(t.dataset.seqc):q.add(t.dataset.seqc);draw();return}
  if(t.id==='seqGo'){seqGo();return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(!G){
    if(el.id==='season'){applySeason(el.value,!!S.carry);drawSetup()}
    else if(el.dataset.tm){const v=+el.value;if(v<0)delete S.teamMap[el.dataset.tm];else S.teamMap[el.dataset.tm]=v;drawSetup()}
    else if(el.dataset.rel!==undefined)S.rels[+el.dataset.rel][+el.dataset.k]=el.value;
    else if(el.dataset.cfrel!==undefined)S.cform.rels[+el.dataset.cfrel][+el.dataset.k]=el.value;
    else if(el.id==='teams'){readStep2();drawSetup()}
    else if(el.id==='player')S.player=el.value;
    else if(['mergeAt','retN','extraRet','extraN','finalSize'].includes(el.id))readStep2();
    return;
  }
  if(el.id==='relSel'){G.relSel=el.value;draw()}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(!G&&el.dataset.tn!==undefined)S.names[+el.dataset.tn]=el.value;
  if(!G&&el.dataset.alname!==undefined)S.alls[+el.dataset.alname].name=el.value;
  if(!G&&el.dataset.cf){const k=el.dataset.cf;if(k[0]==='s'&&k.length===2)S.cform.s[+k[1]]=clamp(num(el.value,5),1,10);else S.cform[k]=el.value}
  if(G&&el.id==='seqN')G.seq.n=num(el.value,G.seq.n);
  if(G&&el.id==='alEp'){G.alEp=+el.value;draw();const r=$('#alEp');if(r)r.focus()}
});
applySeason('isla');drawSetup();
}
</script>
